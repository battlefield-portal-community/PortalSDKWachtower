[project]
name = "portalsdkwachtower"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.37",
    "boto3-stubs~=1.43.37",
    "discord-webhook[async]>=1.4.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.1",
]

[project.scripts]
app = "app.__main__:run"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
